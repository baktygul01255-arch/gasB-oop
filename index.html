<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дракончики с Газового острова</title>
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#1f2d3d;--blue:#2d6cdf;--green:#2e9e5b;--orange:#f08a24;--soft:#e6eefb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:22px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
h1{font-size:34px;margin:6px 0}h2{font-size:28px;margin:4px 0 12px}
button{font:inherit;border:none;border-radius:16px;padding:16px 22px;margin:6px;cursor:pointer;background:var(--blue);color:#fff;min-width:140px;min-height:64px}
button:hover{filter:brightness(1.08)}button:focus{outline:4px solid #ffd54a}
button.alt{background:#fff;color:var(--ink);border:3px solid var(--blue)}
button.big{font-size:30px;min-width:220px;min-height:110px}
button.ok{background:var(--green)}button.soft{background:var(--soft);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.msg{min-height:56px;font-size:26px;text-align:center;margin:10px 0;font-weight:600}
.good{color:var(--green)}.try{color:var(--orange)}
.stars{font-size:32px;text-align:center;letter-spacing:4px}
.emoji{font-size:90px;text-align:center;line-height:1.1}
.prog{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
table{border-collapse:collapse;width:100%;font-size:19px}td,th{border:2px solid #cbd7ea;padding:8px;text-align:center}
input[type=text],input[type=number]{font:inherit;padding:12px;border:3px solid var(--blue);border-radius:12px;width:180px;text-align:center}
.small{font-size:17px;color:#51627a}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
#balloon{font-size:130px;transition:transform .25s;display:inline-block}
.hint{background:#fff8e1;border-radius:12px;padding:10px;font-size:20px}
@media print{.top,button,.small,#rep ~ *{display:none!important}body{background:#fff;font-size:16px}.card{box-shadow:none}.card:not(#rep){display:none}input,select{border:none!important}}</style></head><body><div class="wrap">
<div class="top"><h1>🐉 Дракончики</h1><div><button class="soft" onclick="home()">🏠 Меню</button><button class="soft" id="vc" onclick="toggleVoice()">🗣️ Озвучка вкл.</button><button class="soft" onclick="glossary()">📖 Словарик</button><button class="soft" id="snd" onclick="toggleSound()">🔇 Звуки выкл.</button></div></div>
<div id="app"></div>
<p class="small">Тут нельзя проиграть. Кнопка «🔊 Прочитать» читает текст вслух; озвучку можно выключить вверху. Ошибся — попробуй ещё раз. Подсказка всегда рядом.</p>
</div>
<script>
const $=id=>document.getElementById(id);const app=$('app');
let sound=false,stars=0,AC;
function beep(f,d=0.15){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toggleSound(){sound=!sound;$('snd').textContent=sound?'🔊 Звуки вкл.':'🔇 Звуки выкл.';beep(660)}
const praise=['Молодец!','Отлично!','Правильно!','Супер!','Здорово!'];
const rp=()=>praise[Math.floor(Math.random()*praise.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function starsHTML(){return '⭐'.repeat(stars)||'☆'}

let voice=true;
function say(t){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,' ').replace(/[₁₂]/g,m=>m=='₁'?' один':' два').replace(/\*/g,' умножить на ').replace(/=/g,' равно '));u.lang='ru-RU';u.rate=0.85;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.startsWith('ru'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function sayNow(t){const o=voice;voice=true;say(t);voice=o}
function toggleVoice(){voice=!voice;$('vc').textContent=voice?'🗣️ Озвучка вкл.':'🗣️ Озвучка выкл.';if(voice)say('Озвучка включена');else if('speechSynthesis' in window)speechSynthesis.cancel()}
function rb(t){return `<button class="soft" onclick="sayNow(this.dataset.t)" data-t="${t.replace(/"/g,'&quot;').replace(/<[^>]+>/g,' ')}">🔊 Прочитать</button>`}
const LESSONS={
low:[
{e:'🌬️',t:'Воздух',x:'Вокруг нас есть воздух. Воздух — это газ. Его не видно, но он есть.'},
{e:'🎈',t:'Шарик',x:'Мы надуваем шарик, и внутри шарика воздух. Шарик большой, потому что в нём много воздуха.'},
{e:'🫧',t:'Пузыри',x:'Мы дуем в трубочку, и в воде появляются пузыри. В пузырях воздух.'},
{e:'⚠️',t:'Осторожно',x:'Шарик и пузыри нельзя брать в рот. Розетку нельзя трогать. Горячее трогать нельзя без взрослого.'}],
mid1:[
{e:'🌫️',t:'Что такое газ',x:'Газ — это вещество, которое заполняет всё место, где оно находится. Воздух — это смесь газов. Газ можно сжать.'},
{e:'🔥',t:'Температура',x:'Температура показывает, горячее вещество или холодное. Когда газ нагревают, его частицы двигаются быстрее.'},
{e:'🎈',t:'Объём',x:'Объём — это сколько места занимает газ. Когда газ нагрели, объём становится больше. Когда охладили, объём становится меньше.'},
{e:'💪',t:'Давление',x:'Давление — это насколько сильно газ давит на стенки. Если газ сжать, давление растёт. Если в шину добавить воздух, давление тоже растёт.'}],
mid2:[
{e:'📏',t:'Три величины газа',x:'У газа три главные величины. Давление p. Объём V. Температура T. Температура в формулах записывается в кельвинах. Чтобы перевести градусы Цельсия в кельвины, нужно прибавить двести семьдесят три.'},
{e:'🧊',t:'Изотермический процесс',x:'Изо — значит одинаковый. Терм — значит тепло. В изотермическом процессе температура не меняется. Закон Бойля и Мариотта: давление умножить на объём остаётся одинаковым. Если объём уменьшили в два раза, давление выросло в два раза.'},
{e:'📈',t:'Изобарный процесс',x:'Бар — значит давление. В изобарном процессе давление не меняется. Закон Гей-Люссака: объём делить на температуру остаётся одинаковым. Нагрели газ — объём вырос.'},
{e:'🧯',t:'Изохорный процесс',x:'Хор — значит место, объём. В изохорном процессе объём не меняется, например газ в закрытом баллоне. Закон Шарля: давление делить на температуру остаётся одинаковым. Нагрели баллон — давление выросло.'},
{e:'🚫',t:'Адиабатный процесс',x:'Адиабатный процесс идёт без обмена теплом с окружающей средой. Например, очень быстро сжали воздух в насосе. Газ при сжатии нагревается.'},
{e:'🧮',t:'Как решать задачу',x:'Сначала запиши Дано. Потом Найти. Выбери формулу с карточки. Подставь числа. Запиши ответ с единицами измерения.'}]};
let lessonKey,lessonI,lessonNext;
function lesson(k,next){lessonKey=k;lessonI=0;lessonNext=next;showLesson()}
function showLesson(){const L=LESSONS[lessonKey],x=L[lessonI];
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${(lessonI+1)/L.length*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.t}</h2><p style="text-align:center;font-size:26px">${x.x}</p>
<div class="row">${rb(x.t+'. '+x.x)}</div>
<div class="row">${lessonI>0?'<button class="alt" onclick="lessonI--;showLesson()">⬅ Назад</button>':''}
${lessonI<L.length-1?'<button class="ok" onclick="lessonI++;showLesson()">Дальше ➜</button>':'<button class="ok" onclick="'+lessonNext+'">🎮 Играть!</button>'}</div></div>`;say(x.t+'. '+x.x)}
function glossary(){const GL=[0,1,2,3];const all0=[['Газ','вещество без своей формы; заполняет всё место'],['Давление p','насколько сильно газ давит на стенки'],['Объём V','сколько места занимает газ'],['Температура T','насколько горячее или холодное; в формулах в кельвинах'],['Изотермический','температура не меняется: p·V = const'],['Изобарный','давление не меняется: V/T = const'],['Изохорный','объём не меняется: p/T = const'],['Адиабатный','нет обмена теплом с окружающей средой']];
const all=all0.filter((a,i)=>GL.includes(i));app.innerHTML='<div class="card"><h2>📖 Словарик</h2><table>'+all.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td>${rb(a[0]+'. '+a[1])}</td></tr>`).join('')+'</table><div class="row"><button class="alt" onclick="home()">В меню</button></div></div>'}

function home(){
app.innerHTML=`<div class="card"><h2>Выбери уровень</h2><div class="row">
<button class="big" onclick="lesson('low','startLow()')">🌬️<br>Воздух есть</button>
<button class="big" onclick="lesson('mid1','startMid1()')">🎈<br>Что с газом?</button>
<button class="big" onclick="lesson('mid2','startMid2()')">🧪<br>Газовые законы</button></div>
<p class="stars" id="st">${starsHTML()}</p>
<p class="small">Педагог или тьютор помогает выбрать уровень по РУП: низкий / ниже среднего / средний.</p></div>`}
function done(next){stars++;app.innerHTML=`<div class="card"><div class="emoji">🏆</div><h2 style="text-align:center">Ты прошёл игру!</h2><p class="stars">${starsHTML()}</p><div class="row"><button class="ok" onclick="${next}">Играть ещё</button><button class="alt" onclick="home()">В меню</button></div></div>`;beep(880,.4)}

/* ---------- LOW ---------- */
const lowQ=[
{e:'🎈',q:'Что внутри шарика?',a:['Воздух','Ничего'],c:0},
{e:'🫧',q:'Что получилось, когда подули в трубочку?',a:['Пузыри','Ничего'],c:0},
{e:'💨',q:'Где есть ветер?',a:['У вентилятора','У стола'],c:0},
{e:'🚲',q:'Что внутри шины?',a:['Воздух','Камни'],c:0},
{e:'⚠️',q:'Покажи знак «осторожно»',a:['⚠️','🙂'],c:0,pic:true},
{e:'🫧',q:'Мыльный пузырь большой или маленький?',a:['Большой','Маленький'],c:0}
];
let li=0;
function startLow(){li=0;lowBalloon()}
function lowBalloon(){let n=0;
app.innerHTML=`<div class="card"><h2>Надуй шарик! Нажимай на насос</h2><div class="emoji"><span id="balloon">🎈</span></div>
<div class="prog"><i id="pb"></i></div><div class="msg" id="m">Нажми на насос 5 раз</div>
<div class="row"><button class="big" id="pump">🛠️ Насос</button></div></div>`;
$('pump').onclick=()=>{n++;beep(300+n*60);$('balloon').style.transform=`scale(${1+n*0.18})`;$('pb').style.width=n*20+'%';
if(n>=5){$('m').innerHTML='<span class="good">Шарик надулся! Внутри воздух!</span>';beep(880,.3);$('pump').style.display='none';
app.querySelector('.card').insertAdjacentHTML('beforeend','<div class="row"><button class="ok" onclick="lowAsk()">Дальше ➜</button></div>')}}}
function lowAsk(){
const x=lowQ[li];const opts=shuffle(x.a.map((t,i)=>({t,i})));
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${li/lowQ.length*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.q}</h2>
<div class="msg" id="m"></div><div class="row">${rb(x.q+' '+x.a.join(' или '))}</div><div class="row">${opts.map(o=>`<button class="big" onclick="lowPick(${o.i===x.c},this)">${o.t}</button>`).join('')}</div></div>`;say(x.q+' '+x.a.join(' или '))}
function lowPick(ok,b){if(ok){$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Правильно!');beep(700);confetti();stars++;li++;
setTimeout(()=>{if(li>=lowQ.length){stars--;done("lesson('low','startLow()')")}else lowAsk()},900)}
else{$('m').innerHTML='<span class="try">Попробуй ещё раз. Посмотри внимательно 👀</span>';say('Попробуй ещё раз');b.style.opacity=.35;beep(250)}}

/* ---------- BELOW-MID ---------- */
const bq=[
{e:'🎈🔥',q:'Шарик нагрели. Что с ним?',a:['Расширился','Сжался'],c:0,h:'Тёплый газ занимает больше места.'},
{e:'💉',q:'Воздух в насосе сжали. Давление…',a:['Выросло','Упало'],c:0,h:'Газу тесно — он давит сильнее.'},
{e:'🎈❄️',q:'Шарик положили в холод. Он…',a:['Уменьшился','Увеличился'],c:0,h:'Холодный газ занимает меньше места.'},
{e:'🚲',q:'Шину накачали сильнее. Давление…',a:['Больше','Меньше'],c:0,h:'В шину добавили воздух.'},
{e:'🫧',q:'Воздух в шарике — это…',a:['Газ','Твёрдое тело','Жидкость'],c:0,h:'Газ можно сжать и он заполняет весь объём.'},
{e:'🧯',q:'Где газ сжат в баллоне?',a:['Огнетушитель','Подушка','Ложка'],c:0,h:'Баллон держит сжатый газ.'},
{e:'☀️🎈',q:'Шарик оставили на солнце. Он может…',a:['Лопнуть','Стать твёрдым'],c:0,h:'Газ нагрелся и расширился.'}
];
let bi=0,bnext;
function startMid1(){bi=0;bAsk()}
function bAsk(){const x=bq[bi];const opts=shuffle(x.a.map((t,i)=>({t,i})));
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${bi/bq.length*100}%"></i></div><div class="emoji">${x.e}</div><h2 style="text-align:center">${x.q}</h2>
<div class="msg" id="m"></div><div class="row">${rb(x.q+' '+x.a.join(' или '))}</div><div class="row">${opts.map(o=>`<button class="big" onclick="bPick(${o.i===x.c},this)">${o.t}</button>`).join('')}</div>
<div class="row"><button class="soft" onclick="hnt++;$('hh').style.display='block';sayNow('${x.h}')">💡 Подсказка</button></div><div class="hint" id="hh" style="display:none">${x.h}</div></div>`;say(x.q+' '+x.a.join(' или '))}
function bPick(ok,b){if(ok){$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Правильно!');beep(700);confetti();stars++;bi++;
setTimeout(()=>{if(bi>=bq.length){stars--;done("lesson('mid1','startMid1()')")}else bAsk()},1000)}
else{$('m').innerHTML='<span class="try">Почти! Нажми «Подсказка» и выбери ещё раз.</span>';say('Почти. Нажми подсказку и попробуй ещё раз');b.style.opacity=.35;beep(250)}}

/* ---------- MID: laws ---------- */
let mi=0,mt;
const lawsInfo=`<table><tr><th>Что постоянно</th><th>Процесс</th><th>Формула</th></tr>
<tr><td>T</td><td>изотермический</td><td>p₁V₁ = p₂V₂</td></tr>
<tr><td>p</td><td>изобарный</td><td>V₁/T₁ = V₂/T₂</td></tr>
<tr><td>V</td><td>изохорный</td><td>p₁/T₁ = p₂/T₂</td></tr></table>
<p class="small">T в кельвинах: T = t + 273. Адиабатный процесс — без теплообмена с окружающей средой.</p>`;
function startMid2(){mi=0;mSort()}
const sortQ=[['Постоянна температура T','Изотермический'],['Постоянно давление p','Изобарный'],['Постоянен объём V','Изохорный']];
function mSort(){const items=shuffle(sortQ.map(x=>x[0]));let idx=0,pos=0;
const q=sortQ[idx]; mi=0; sortStep()}
function sortStep(){
if(mi>=sortQ.length){mi=0;return mTask()}
const x=sortQ[mi];const opts=shuffle(sortQ.map(s=>s[1]));
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${mi/sortQ.length*100}%"></i></div><h2>Часть 1. Какой это процесс?</h2><p class="stars" style="font-size:28px;letter-spacing:0">${x[0]}</p>
<div class="msg" id="m"></div><div class="row">${opts.map(o=>`<button onclick="sortPick('${o}',this)">${o}</button>`).join('')}</div>
<div class="row">${rb(x[0]+'. Какой это процесс?')}</div><details class="card"><summary>📋 Карточка формул</summary>${lawsInfo}</details></div>`;say('Какой это процесс? '+x[0])}
function sortPick(o,b){if(o===sortQ[mi][1]){$('m').innerHTML='<span class="good">'+rp()+' ⭐</span>';say('Правильно!');beep(700);confetti();stars++;mi++;setTimeout(sortStep,900)}
else{$('m').innerHTML='<span class="try">Подумай, какая величина не меняется. Попробуй ещё.</span>';say('Подумай, какая величина не меняется');b.style.opacity=.35;beep(250)}}

function genTask(){
const r=Math.floor(Math.random()*3);
if(r===0){const p1=[100,200,300][Math.floor(Math.random()*3)],V1=[6,4,8][Math.floor(Math.random()*3)],k=2;
 return{law:'Изотермический (T = const)',t:`Газ: p₁ = ${p1} кПа, V₁ = ${V1} л. Объём уменьшили в ${k} раза при постоянной T. Найди p₂ (кПа).`,ans:p1*k,u:'кПа',f:'p₂ = p₁·V₁ / V₂',h:`V₂ = ${V1/k} л. Подставь: ${p1}·${V1} / ${V1/k}`}}
if(r===1){const p1=[100,150,200][Math.floor(Math.random()*3)],T1=300,T2=[360,450,600][Math.floor(Math.random()*3)];
 return{law:'Изохорный (V = const)',t:`Газ в баллоне: p₁ = ${p1} кПа при T₁ = ${T1} К. Нагрели до T₂ = ${T2} К. Найди p₂ (кПа).`,ans:p1*T2/T1,u:'кПа',f:'p₂ = p₁·T₂ / T₁',h:`Подставь: ${p1}·${T2} / ${T1}`}}
const V1=[2,3,4][Math.floor(Math.random()*3)],T1=[250,200,300][Math.floor(Math.random()*3)];
return{law:'Изобарный (p = const)',t:`Газ: V₁ = ${V1} л при T₁ = ${T1} К. Нагрели до T₂ = ${T1*2} К при постоянном p. Найди V₂ (л).`,ans:V1*2,u:'л',f:'V₂ = V₁·T₂ / T₁',h:`Подставь: ${V1}·${T1*2} / ${T1}`}}
let task,tries=0;
function mTask(){
if(mi>=4){stars--;return done("lesson('mid2','startMid2()')")}
task=genTask();tries=0;
app.innerHTML=`<div class="card"><div class="prog"><i style="width:${mi/4*100}%"></i></div><h2>Часть 2. Задача ${mi+1} из 4</h2>
<p>${task.t}</p><p class="small">Дано → Найти → Решение → Ответ</p>
<div class="row"><span>Ответ: </span><input type="number" id="ans" inputmode="decimal"><span>${task.u}</span></div>
<div class="msg" id="m"></div>
<div class="row"><button class="ok" onclick="mCheck()">Проверить</button><button class="soft" onclick="mHint(1)">💡 Подсказка 1</button><button class="soft" onclick="mHint(2)">💡 Подсказка 2</button></div>
<div class="hint" id="hh" style="display:none"></div>
<div class="row">${rb(task.t)}</div><details class="card"><summary>📋 Карточка формул</summary>${lawsInfo}</details></div>`;say(task.t)}
function mHint(n){hnt++;const h=$('hh');h.style.display='block';h.innerHTML=n===1?'Это <b>'+task.law+'</b>. Формула: <b>'+task.f+'</b>':task.h;say(h.textContent)}
function mCheck(){const v=parseFloat($('ans').value.replace(',','.'));

/* gas box */
function GasBox(cv,st){const g=cv.getContext('2d'),W=cv.width,H=cv.height,N=34,pts=[];
for(let i=0;i<N;i++)pts.push({x:Math.random()*200+20,y:Math.random()*(H-80)+40,a:Math.random()*6.28});
(function loop(){if(!cv.isConnected)return;g.clearRect(0,0,W,H);
const bw=60+st.V*(W-140);const sp=1.2+Math.sqrt(st.T)*1.1;
// box
g.fillStyle='#eef4ff';g.fillRect(30,30,bw,H-60);
g.lineWidth=6;g.strokeStyle='#2d6cdf';g.strokeRect(30,30,bw,H-60);
// piston
g.fillStyle='#8895a7';g.fillRect(30+bw,30,22,H-60);g.fillRect(52+bw,H/2-8,Math.max(10,W-52-bw-30),16);g.fillStyle='#51627a';g.fillRect(W-40,H/2-30,18,60);
// flame/ice
g.font='46px serif';if(st.heat>0)g.fillText('🔥',30+bw/2-23,H-8);if(st.heat<0)g.fillText('❄️',30+bw/2-23,H-8);
const col=`hsl(${Math.max(0,230-st.T*22)},85%,50%)`;
pts.forEach(p=>{p.x+=Math.cos(p.a)*sp;p.y+=Math.sin(p.a)*sp;
if(p.x<42){p.x=42;p.a=Math.PI-p.a}if(p.x>30+bw-12){p.x=30+bw-12;p.a=Math.PI-p.a}
if(p.y<42){p.y=42;p.a=-p.a}if(p.y>H-42){p.y=H-42;p.a=-p.a}
g.beginPath();g.arc(p.x,p.y,9,0,6.28);g.fillStyle=col;g.fill()});
requestAnimationFrame(loop)})()}

function drawGraph(cv,c,pts,cur,line){const g=cv.getContext('2d'),W=cv.width,H=cv.height,L=70,B=H-50,R=W-20,T0=20;g.clearRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,0,W,H);
const X=x=>L+x/c.xmax*(R-L),Y=y=>B-y/c.ymax*(B-T0);g.font='16px sans-serif';g.strokeStyle='#cbd7ea';g.lineWidth=1;g.fillStyle='#1f2d3d';
for(let x=0;x<=c.xmax+1e-9;x+=c.xs){g.beginPath();g.moveTo(X(x),T0);g.lineTo(X(x),B);g.stroke();g.textAlign='center';g.fillText(x,X(x),B+20)}
for(let y=0;y<=c.ymax+1e-9;y+=c.ys){g.beginPath();g.moveTo(L,Y(y));g.lineTo(R,Y(y));g.stroke();g.textAlign='right';g.fillText(y,L-8,Y(y)+5)}
g.strokeStyle='#1f2d3d';g.lineWidth=3;g.beginPath();g.moveTo(L,T0);g.lineTo(L,B);g.lineTo(R,B);g.stroke();
g.textAlign='center';g.font='bold 18px sans-serif';g.fillText(c.xl,(L+R)/2,H-8);g.save();g.translate(16,(T0+B)/2);g.rotate(-Math.PI/2);g.fillText(c.yl,0,0);g.restore();
if(c.curve){g.strokeStyle='#9db8ee';g.lineWidth=3;g.setLineDash([8,6]);g.beginPath();c.curve.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke();g.setLineDash([])}
if(line&&pts.length>1){g.strokeStyle='#d22';g.lineWidth=4;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke()}
g.fillStyle='#d22';pts.forEach(p=>{g.beginPath();g.arc(X(p[0]),Y(p[1]),9,0,6.28);g.fill()});
if(cur){g.fillStyle='#2e9e5b';g.beginPath();g.arc(X(cur[0]),Y(cur[1]),11,0,6.28);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
return{X,Y,L,R,B,T0}}
